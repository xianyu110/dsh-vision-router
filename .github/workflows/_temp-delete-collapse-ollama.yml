name: Delete obsolete collapse-ollama branch

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/_temp-delete-collapse-ollama.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            try {
              await github.rest.git.deleteRef({ owner, repo, ref: 'heads/feat/collapse-ollama-settings' });
              core.info('Deleted feat/collapse-ollama-settings');
            } catch (error) {
              if (error.status !== 422 && error.status !== 404) throw error;
              core.info('Branch already absent');
            }

            const path = '.github/workflows/_temp-delete-collapse-ollama.yml';
            const current = await github.rest.repos.getContent({ owner, repo, path, ref: 'main' });
            await github.rest.repos.deleteFile({
              owner,
              repo,
              path,
              message: 'chore: remove one-shot branch cleanup workflow',
              sha: current.data.sha,
              branch: 'main',
            });
