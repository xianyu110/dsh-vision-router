name: Hotfix v1.4.4

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hotfix-1.4.4.yml'

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm

      - name: Patch rc.6 client dependencies and prepare v1.4.4
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'{path}: expected text not found: {old!r}')
              p.write_text(text.replace(old, new, 1))

          # settingsScope.bind() resolves connection/remote from the caller fiber.
          replace(
              'lib/client.js',
              "exports.inject = ['settingsScope', 'slots', 'locale', 'sessions']",
              "exports.inject = ['settingsScope', 'slots', 'locale', 'sessions', 'connection', 'remote']",
          )

          pkg_path = Path('package.json')
          pkg = json.loads(pkg_path.read_text())
          if pkg.get('version') != '1.4.3':
              raise SystemExit(f"package.json: expected 1.4.3, got {pkg.get('version')}")
          pkg['version'] = '1.4.4'
          injects = pkg.setdefault('dsh', {}).setdefault('client', {}).setdefault('inject', [])
          for name in ['@deepseek-ai/dsh-client-connection', '@deepseek-ai/dsh-api-remotes']:
              if name not in injects:
                  injects.append(name)
          pkg_path.write_text(json.dumps(pkg, ensure_ascii=False, indent=2) + '\n')

          replace(
              'tests/client.test.js',
              "assert.deepEqual(bundle.inject, ['settingsScope', 'slots', 'locale', 'sessions'])",
              "assert.deepEqual(bundle.inject, ['settingsScope', 'slots', 'locale', 'sessions', 'connection', 'remote'])",
          )

          manifest = Path('tests/manifest-dependencies.test.js')
          text = manifest.read_text()
          needle = "  assert.equal(pkg.peerDependencies?.['@deepseek-ai/schemastery'], undefined)\n"
          addition = needle + "  assert.ok(pkg.dsh?.client?.inject?.includes('@deepseek-ai/dsh-client-connection'))\n  assert.ok(pkg.dsh?.client?.inject?.includes('@deepseek-ai/dsh-api-remotes'))\n"
          if needle not in text:
              raise SystemExit('tests/manifest-dependencies.test.js: insertion point not found')
          manifest.write_text(text.replace(needle, addition, 1))

          readme = Path('README.md')
          text = readme.read_text()
          text = text.replace('/releases/tag/v1.4.3', '/releases/tag/v1.4.4', 1)
          text = text.replace('release-v1.4.3-5B4CF0', 'release-v1.4.4-5B4CF0', 1)
          text = text.replace('Release v1.4.3', 'Release v1.4.4', 1)
          text = text.replace('📌 **Announcement (v1.4.3)**', '📌 **Announcement (v1.4.4)**', 1)
          old_en = '**v1.4.3:** Custom vision backends are runtime-verified instead of blocked by DSH capability metadata, including WebSocket/private transports.'
          new_en = '**v1.4.4:** Fixes the blank DSH rc.6 plugin settings page by declaring the client services required by settingsScope.'
          if old_en not in text:
              raise SystemExit('README.md: v1.4.3 announcement not found')
          readme.write_text(text.replace(old_en, new_en, 1))

          readme_zh = Path('README.zh.md')
          text = readme_zh.read_text()
          text = text.replace('/releases/tag/v1.4.3', '/releases/tag/v1.4.4', 1)
          text = text.replace('release-v1.4.3-5B4CF0', 'release-v1.4.4-5B4CF0', 1)
          text = text.replace('Release v1.4.3', 'Release v1.4.4', 1)
          text = text.replace('📌 **公告（v1.4.3）**', '📌 **公告（v1.4.4）**', 1)
          old_zh = '**v1.4.3：自定义视觉后端改为运行时验证，支持 WebSocket/私有协议。**'
          new_zh = '**v1.4.4：修复 DSH rc.6 插件配置页空白。**'
          if old_zh not in text:
              raise SystemExit('README.zh.md: v1.4.3 announcement not found')
          readme_zh.write_text(text.replace(old_zh, new_zh, 1))

          changelog = Path('CHANGELOG.md')
          text = changelog.read_text()
          anchor = '\n## v1.4.3\n'
          section = '''\n## v1.4.4\n\n### 修复 / Fixed\n\n- **DSH rc.6 插件配置页空白**：补齐浏览器端插件对 `connection` / `remote` 的运行时依赖声明，并在 package manifest 中显式注入 `@deepseek-ai/dsh-client-connection` 与 `@deepseek-ai/dsh-api-remotes`。`settingsScope.bind()` 现在能从调用方上下文取得设置 transport 与更新事件，配置卡可正常注册；无需手动修改 `settings.yaml`。对应 client / manifest 回归断言同步更新。\n- **Blank plugin settings on DSH rc.6**: declare the browser plugin's runtime `connection` / `remote` service dependencies and explicitly inject `@deepseek-ai/dsh-client-connection` plus `@deepseek-ai/dsh-api-remotes` in the package manifest. `settingsScope.bind()` can now resolve its settings transport and invalidation events from the caller context, so the configuration card registers normally without manual `settings.yaml` edits. Client and manifest regression assertions were updated alongside the fix.\n'''
          if anchor not in text:
              raise SystemExit('CHANGELOG.md: v1.4.3 anchor not found')
          changelog.write_text(text.replace(anchor, section + anchor, 1))
          PY

      - run: pnpm install --frozen-lockfile
      - run: pnpm test

      - name: Commit, remove temporary workflow, tag and push
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/hotfix-1.4.4.yml
          git add lib/client.js package.json tests/client.test.js tests/manifest-dependencies.test.js README.md README.zh.md CHANGELOG.md
          git commit -m 'fix: restore plugin settings card on DSH rc.6 and release v1.4.4'
          git tag v1.4.4
          git push origin HEAD:main v1.4.4
