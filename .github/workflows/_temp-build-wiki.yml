          cat > Vision-Providers.md <<'WIKI_EOF'
# Vision Providers

Vision Router 把“脑”和“眼睛”分开：

- **Brain**：聊天右下角选择的 DeepSeek / opencode 等推理模型；
- **Eyes**：Settings 中配置的视觉模型链。

一个 text-only brain 完全可以配一个独立的视觉 backend。

## 默认 fallback 顺序

在 tools-first 模式下，视觉工具会依次尝试：

1. **用户视觉模型**：Settings 中明确配置的 vision backend rows；
2. **Ollama**：可选、默认关闭；
3. **LM Studio**：可选、默认关闭；
4. **Custom HTTP**：高级 OpenAI-compatible / compatible endpoint；
5. **匿名 OVHcloud 免费链**：默认最后兜底。

429 / 网络 / quota / region 等失败会被分类，并继续尝试下一后端。匿名免费链不需要账号或 API key。

## 内置免费链

当前稳定线使用多个 OVHcloud 匿名模型作为最后 fallback。匿名额度按模型/IP 分桶，适合开箱即用和低到中频使用。

如果免费匿名额度不够，推荐在 Settings 中配置你自己的免费/付费视觉模型，让它排在匿名 fallback 前面。

> 免费额度和模型目录会变化；以 provider 控制台和仓库当前 README 为准。

## Ollama：本地优先

先安装 Ollama 并拉一个视觉模型，例如：

```sh
ollama pull qwen2.5vl
```

然后开启：

```yaml
- id: vision-router
  config:
    localOllama:
      enabled: true
      baseURL: 'http://127.0.0.1:11434/v1'
      model: 'qwen2.5vl'
    instantDescribe: true
    localDescribeStyle: structured
```

特点：

- 无 key；
- 可离线；
- backend 挂掉会自动跳过；
- 可作为 instant describe 的第一本地后端；
- 支持 `openai` / `anthropic` format。

## LM Studio

默认 endpoint：

```text
http://localhost:1234/v1
```

开启后请填写 LM Studio Developer 页面或 `/v1/models` 给出的真实 model ID。

LM Studio 位于 Ollama 之后、自定义/cloud HTTP 后端之前。Anthropic `/v1/messages` 模式需要 LM Studio 0.4.1+。

## 严格 local-only

如果你想让图片完全不发到云端：

1. 开启 Ollama 和/或 LM Studio；
2. 移除 cloud vision rows / custom HTTP endpoints；
3. 关闭 `freeFallback`；
4. 如使用 `vision_screenshot`，仍需单独开启桌面截图权限。

## 自定义视觉模型

每个 Settings row 指定一个可调用的 provider/model。运行时优先尝试 DSH 已注册 adapter；只有确认存在 HTTP OpenAI Chat Completions 兼容入口时，才走 direct compatibility bridge。

不要把只会文本的模型误当作视觉 backend。聊天模型是否支持图片与它能否作为 brain 是两个不同问题。
