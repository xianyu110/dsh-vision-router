          cat > Architecture.md <<'WIKI_EOF'
# Architecture

## 一句话

`dsh-vision-router` 不是“把图片描述一次再塞给 DeepSeek”这么简单，而是把 **视觉当成 agent 可以反复调用的证据工具层**。

```text
User image
   │
   ▼
Auto Vision wrapper
   │
   ├─ pass 1: structured visual bootstrap
   │            │
   │            ▼
   │      task-independent visual map
   │
   └─ x follow-up evidence calls (x >= 1)
          ├─ vision_describe
          ├─ vision_ground / vision_detect
          ├─ vision_crop
          ├─ vision_ocr
          ├─ vision_pixel_diff
          └─ ...
                   │
                   ▼
             DeepSeek reasoning
```

这就是 **`1+x`**：第一次是固定职责的结构化预识别，后面不是固定“再识别一次”，而是 agent 根据不确定性和任务自由选择一个或多个后续视觉工具。

## Pass 1：结构化预识别

第一遍不应该提前替用户完成任务，而是建立一个 task-independent 的视觉地图，包含：

- `visual_kind`
- overview
- regions / layout
- visible text
- entities
- relationships
- uncertainties
- recommended follow-ups

它的目标是保留高信息密度证据，让后面的 text agent 知道哪里值得继续看，而不是把整张图压缩成一句描述。

图片里的文字始终被当作**不可信证据**，而不是要执行的系统指令。

## x：自由工具调用

Bootstrap 之后必须有至少一次后续证据调用。具体调用次数和工具由任务决定，例如：

### UI 复刻

```text
bootstrap → detect controls → crop target → pixel diff → screenshot verify
```

### 文档/表格

```text
bootstrap → focused describe → OCR uncertain region → structured answer
```

### 普通图片问答

```text
bootstrap → focused describe → answer
```

所以它不是固定 `1+1`，而是 **`1+x`**。

## Brain / Eyes 分离

- **Brain**：DeepSeek / opencode 等日常推理模型；
- **Eyes**：独立视觉 backend chain。

用户在聊天页选择的是 brain wrapper（`+ Auto Vision`）；Settings 中选择的是 eyes。

文本轮继续由原模型处理，视觉模型只在需要“看”的时候被调用。

## 为什么保留原图

会话 UI 继续显示原始图片。Vision Router 的 image rewrite 发生在模型调用输入层，而不是把会话历史永久替换成描述文本。

这样 agent 可以围绕同一原图继续做：

- grounding / detection；
- crop；
- OCR；
- color / pixel-level comparison；
- screenshot verification；
- 多轮视觉追问。

## Fallback chain

工具调用失败不会立刻结束整轮任务，而是继续尝试下一视觉 backend。链路可以同时包含：

```text
user VLM → Ollama → LM Studio → custom HTTP → anonymous OVH
```

错误会区分 rate limit、quota、network、region、context 等类型。429 会尽快切到下一后端，并使用受限的 cooldown。

## Cache / image memory

同一图片的重复视觉请求会结合内容缓存和 image memory，减少无意义的重复识别。本地 instant describe 也会复用已经命中的图片结果。

## Stable vs experimental

本页只描述 `main` 已落地的稳定结构。

v2 capability-aware routing / scene routing 仍属于实验开发线；等稳定并入 `main` 后再进入 Wiki 的正式架构说明。
