          cat > Troubleshooting.md <<'WIKI_EOF'
# Troubleshooting

## `the current model does not support images`

**最常见原因：选错模型组。**

回到聊天页右下角，把原始文本模型组切成对应的 **`+ Auto Vision`** 模型组，再重新发送图片。

## 和 dsh-web-ui / dsh-web-ui-all 冲突

`dsh-web-ui` / `@linxin666/dsh-web-ui-all` 的图片 send hook 可能先把原图改写成 `describe-image` 引用，导致 Vision Router 收不到原始 image block。

在它的设置里找到 Image understanding，关闭：

**“Rewrite images to describe-image references on send”**

等价配置：

```yaml
interceptImageSend: false
```

这个开关按每次发送实时读取，一般无需重装 hook 或重启 DSH。

## 新版本发布了但升级还是旧版

pnpm v11 对发布不到 24 小时的版本可能有 age gate。显式指定版本：

```sh
npx @deepseek-ai/dsh plugin --profile web add dsh-vision-router@<version>
```

或者：

```sh
npx dsh-vision-router repair
```

## 启动时报 JSON / `Unexpected token` / BOM

先诊断：

```sh
npx dsh-vision-router doctor --profile web
```

修复 UTF-8 BOM：

```sh
npx dsh-vision-router repair --profile web
```

repair 只移除 BOM 并重新验证 JSON，不会乱改其它配置。

## `duplicate loader entry id: vision-router`

通常是早期 v0.x 手动安装留下了重复的 `insert` block。

检查：

```text
~/.dsh/profiles/<profile>/cordis.patch.yml
```

删除旧的：

```yaml
- insert:
    - id: vision-router
      name: dsh-vision-router
```

如果需要保留自定义参数，改成普通 by-id override，而不是再次 `insert`。

## `colourspace: parameter space not set`

通常是旧版 profile 里残留的 sharp 0.34.0 / libvips 与 host sharp 冲突。

删除 profile 下旧的：

```text
node_modules/sharp
node_modules/@img
```

然后重启，或在 profile 内重新 `pnpm install`。

## Oh-DSH Desktop 安装后打不开

Oh-DSH 使用：

```text
~/.ohdsh
```

而不是普通 `~/.dsh`。请使用 desktop profile 安装：

```sh
DSH_HOME=~/.ohdsh npx @deepseek-ai/dsh plugin --profile desktop add dsh-vision-router
```

较老 Desktop runtime 与旧版 Vision Router 曾存在启动冲突；建议使用当前版本。

## Ollama / LM Studio 没反应

依次确认：

1. 本地服务本身已启动；
2. `baseURL` 正确；
3. 配置的模型真实存在；
4. LM Studio 使用 `/v1/models` 返回的真实 ID；
5. 点击 Settings 里的 **Test connection**；
6. 检查是否被代理软件错误代理了 `localhost` / `127.0.0.1`。

本地后端失败后，默认会继续 fallback 到后续视觉 backend；这属于预期行为。

## 桌面截图工具不可用

`vision_screenshot` 涉及隐私，默认关闭。需要单独开启 `desktopScreenshot`。

- macOS / Windows 使用系统截图能力；
- Linux 需要 ImageMagick `import` 或 `scrot`，且必须处于可截图的桌面 session；
- Wayland 是否可用取决于桌面环境。

## 仍然有问题

提交 Issue 时建议附：

- DSH 版本；
- dsh-vision-router 版本；
- Web / Oh-DSH Desktop / 其它运行方式；
- 使用的 brain model group；
- 使用的 vision backend；
- 最小复现步骤；
- 相关日志（注意先移除 key / token）。

Issues: https://github.com/ysr666/dsh-vision-router/issues
