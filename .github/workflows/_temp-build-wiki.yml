# Settings Reference

Web 设置入口：

**Settings → Plugins → Plugin config → 视觉路由（自动识图）**

大多数用户只需要确认自动视觉包装开启，然后回聊天页选 `+ Auto Vision`。其余项目主要用于高级定制。

## 最重要的几个设置

| 设置 | 默认 | 用途 |
|---|---:|---|
| `autoWrapProviders` | `true` | 自动为已启用模型生成同名 `+ Auto Vision` 组 |
| `wrappedProviders` | DeepSeek 默认 scope | 手动限制哪些 provider/model 生成视觉包装；通常不需要改 |
| `routing` | `false` | `false` = 推荐的 tools-first 多步视觉；`true` = 旧式整轮路由 |
| `tool` | `true` | 启用视觉工具 |
| `rewriteImages` | `true` | 仅在模型调用输入里改写图片提示；会话 UI 仍保留原图 |
| `stealth` | `false` | 接管官方 DeepSeek route；普通用户建议保持关闭 |
| `freeFallback` | `true` | 显式后端失败后继续使用内置匿名 OVH 免费链 |
| `desktopScreenshot` | `false` | 允许模型调用桌面截图；隐私敏感，必须显式开启 |

## Vision backend chain

这里配置的是“眼睛”，不是聊天模型。

调用顺序大致为：

1. 用户配置的视觉模型；
2. Ollama；
3. LM Studio；
4. 自定义 HTTP 视觉 endpoint；
5. 内置匿名 OVH fallback。

详见 **[Vision Providers](Vision-Providers)**。

## Local vision

### Ollama

```yaml
localOllama:
  enabled: false
  baseURL: http://127.0.0.1:11434/v1
  model: qwen2.5vl
  format: openai
```

### LM Studio

```yaml
localLmStudio:
  enabled: false
  baseURL: http://localhost:1234/v1
  model: ''
  format: openai
```

LM Studio 的 `model` 应填写 Developer 页面或 `/v1/models` 返回的真实模型 ID。

### Instant describe

| 设置 | 默认 | 说明 |
|---|---:|---|
| `instantDescribe` | `false` | 首个模型 step 前先用可用的本地 VLM 识别未缓存图片 |
| `localDescribeStyle` | `plain` | `plain` 平铺描述；`structured` 更适合 UI / 截图结构分析 |

本地识别失败不会把整轮聊天打崩；它会按链路继续 fallback。

## 性能与可靠性

| 设置 | 默认 | 说明 |
|---|---:|---|
| `downscale` | `true` | 大图在视觉调用前自动缩放 |
| `downscaleMaxPixels` | `4000000` | 默认 4MP 像素预算 |
| `cache` | `true` | 缓存视觉回答 |
| `cacheTtlSeconds` | `3600` | 默认缓存 1 小时 |
| `cacheMaxEntries` | `200` | 最大缓存条目 |
| `timeoutMs` | `120000` | 单次视觉调用 deadline |
| `artifactsDir` | `.dsh-vision-router/artifacts` | crop / diff / screenshot 等产物目录 |

## Advanced routing

- `wrapperRoute`：默认 `deepseek-vision`
- `chainRoute`：默认 `vision-chain`
- `textProvider`：推理主脑 route/model
- `progressiveTools`：渐进挂载工具；默认关闭以保持 tool schema 稳定
- `autoActivateOnImage`：progressive mode 下遇图自动挂载
- `catalogCorrections`：对已知上游模型 catalog/wire-protocol 错配做临时修正；上游修好后对应修正自动失效

## 设置修改是否需要重启？

多数运行时设置和模型目录变化会热更新。只有插件 bundle 第一次被一个长期运行的进程发现时，通常需要让对应 DSH 进程重新加载一次。
