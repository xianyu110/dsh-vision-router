name: Build project wiki

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/_temp-build-wiki.yml

permissions:
  contents: write

jobs:
  build-wiki:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Clone wiki
        shell: bash
        run: |
          set -euo pipefail
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" wiki

      - name: Write wiki pages
        shell: bash
        run: |
          set -euo pipefail
          cd wiki

          cat > Home.md <<'WIKI_EOF'
# dsh-vision-router Wiki

> 给 DeepSeek Harness 文本模型补上真正可迭代的视觉能力：**DeepSeek 负责推理，视觉后端负责看图。**

这是 `dsh-vision-router` 的完整使用文档入口。README 保持项目介绍和快速上手；更详细的配置、后端、故障排查与架构说明放在这里。

## 30 秒开始

```sh
npx @deepseek-ai/dsh plugin --profile web add dsh-vision-router
```

安装后：

1. 回到聊天页；
2. 在右下角模型选择器中选择带 **`+ Auto Vision`** 的模型组；
3. 直接粘贴或上传图片；
4. 正常提问即可。

> **最常见误区：**右下角模型选择器选的是“脑”（对话/推理模型），Settings 里的 Vision backend 选的是“眼睛”（看图模型）。两者是分开的。

## 文档导航

- **[Getting Started](Getting-Started)** — 安装、升级、卸载、Web / Oh-DSH Desktop
- **[Settings Reference](Settings-Reference)** — 设置页各项到底做什么
- **[Vision Providers](Vision-Providers)** — 免费链、Ollama、LM Studio、自定义视觉后端
- **[Troubleshooting](Troubleshooting)** — 图片发送失败、插件冲突、升级/启动问题
- **[Architecture](Architecture)** — `1+x` 视觉工作流、brain/eyes 分离、fallback 与缓存

## 项目核心能力

- **开箱即用免费视觉**：内置匿名 OVHcloud 多模型 fallback，不配置 key 也能用。
- **1+x 多步视觉**：先做一次结构化预识别，再由 agent 根据证据自由调用一个或多个视觉工具继续验证和深入。
- **原图留在视觉侧**：不是把图片先压成一段描述后就结束；agent 可以继续 grounding、crop、OCR、pixel diff 等多步操作。
- **本地视觉**：可选 Ollama / LM Studio，支持本地优先、离线识别和 instant describe。
- **DeepSeek 保持主脑**：文本轮不需要切换成视觉模型。
- **无 Python runtime**：核心图像工具链走 Node.js 生态。

## 当前稳定线

Wiki 以 `main` 上的稳定实现为准。实验分支（例如 v2 capability-aware / scene routing）不会在这里当作稳定功能承诺。

- Repository: https://github.com/ysr666/dsh-vision-router
- 中文 README: https://github.com/ysr666/dsh-vision-router/blob/main/README.zh.md
- Issues: https://github.com/ysr666/dsh-vision-router/issues
- QQ 交流群：`1105463028`
