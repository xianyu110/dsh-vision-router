name: Build project wiki

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/_temp-build-wiki.yml

permissions:
  contents: write

jobs:
  build-wiki:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Clone wiki
        shell: bash
        run: |
          set -euo pipefail
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" wiki

      - name: Build wiki pages from current docs
        shell: bash
        run: |
          set -euo pipefail
          section() {
            awk -v start="$1" -v end="$2" '$0 == start {p=1} p && $0 == end {exit} p' README.md
          }
          rewrite_assets() {
            sed 's#src="assets/#src="https://raw.githubusercontent.com/ysr666/dsh-vision-router/main/assets/#g'
          }

          {
            printf '%s\n' '# dsh-vision-router Wiki'
            printf '%s\n' ''
            printf '%s\n' '> 给 DeepSeek Harness 文本模型补上真正可迭代的视觉能力：**DeepSeek 负责推理，视觉后端负责看图。**'
            printf '%s\n' ''
            printf '%s\n' 'README 负责项目首页和快速介绍；Wiki 负责完整使用手册。'
            printf '%s\n' ''
            printf '%s\n' '## 30 秒开始'
            printf '%s\n' ''
            printf '%s\n' '```sh'
            printf '%s\n' 'npx @deepseek-ai/dsh plugin --profile web add dsh-vision-router'
            printf '%s\n' '```'
            printf '%s\n' ''
            printf '%s\n' '安装后回到聊天页，在右下角选择带 **`+ Auto Vision`** 的模型组，然后直接粘贴或上传图片。'
            printf '%s\n' ''
            printf '%s\n' '> **记住：**聊天模型选择器选的是 brain；Settings 中的 Vision backend 选的是 eyes。两者相互独立。'
            printf '%s\n' ''
            printf '%s\n' '## 文档导航'
            printf '%s\n' ''
            printf '%s\n' '- **[Getting Started](Getting-Started)** — 安装、升级、卸载、Oh-DSH Desktop'
            printf '%s\n' '- **[Settings Reference](Settings-Reference)** — 设置页与完整配置'
            printf '%s\n' '- **[Vision Providers](Vision-Providers)** — 免费链、用户 VLM、本地与 fallback'
            printf '%s\n' '- **[Troubleshooting](Troubleshooting)** — 常见安装、冲突与运行问题'
            printf '%s\n' '- **[Architecture](Architecture)** — tools-first、`1+x`、工具层与 brain/eyes 分离'
            printf '%s\n' ''
            printf '%s\n' '## 当前稳定架构'
            printf '%s\n' ''
            printf '%s\n' '当前 `main` 已包含 `vision_bootstrap`：先做一次 task-independent 的结构化视觉预识别，再由 agent 根据不确定性和任务自由调用一个或多个后续视觉工具。也就是 **`1+x`，不是固定 `1+1`**。'
            printf '%s\n' ''
            printf '%s\n' '实验性的 v2 capability-aware / scene routing 分支不会在稳定 Wiki 中提前承诺。'
            printf '%s\n' ''
            printf '%s\n' '- [Repository](https://github.com/ysr666/dsh-vision-router)'
            printf '%s\n' '- [中文 README](https://github.com/ysr666/dsh-vision-router/blob/main/README.zh.md)'
            printf '%s\n' '- [Issues](https://github.com/ysr666/dsh-vision-router/issues)'
            printf '%s\n' '- QQ 交流群：`1105463028`'
          } > wiki/Home.md

          {
            printf '%s\n' '# Getting Started'
            printf '%s\n' ''
            section '## Quick start' '## Free vision key channels'
            printf '%s\n' ''
            section '## Install and lifecycle' '## Troubleshooting'
          } | rewrite_assets > wiki/Getting-Started.md

          {
            printf '%s\n' '# Settings Reference'
            printf '%s\n' ''
            printf '%s\n' '> Web 入口：**Settings → Plugins → Plugin config → 视觉路由（自动识图）**。普通用户通常只需要选择 `+ Auto Vision`；其余配置用于后端、性能、隐私和高级路由。'
            printf '%s\n' ''
            section '## Web settings' '## Requirements'
          } | rewrite_assets > wiki/Settings-Reference.md

          {
            printf '%s\n' '# Vision Providers'
            printf '%s\n' ''
            printf '%s\n' '> Brain 是聊天推理模型；Eyes 是下面这条视觉 backend chain。一个 text-only brain 完全可以使用独立 VLM 看图。'
            printf '%s\n' ''
            section '## Free vision key channels' '## Highlights'
            printf '%s\n' ''
            section '## Provider fallback chain' '## Stealth mode'
          } | rewrite_assets > wiki/Vision-Providers.md

          {
            printf '%s\n' '# Troubleshooting'
            printf '%s\n' ''
            printf '%s\n' '> 最先检查：发送图片前，聊天右下角是否选中了带 **`+ Auto Vision`** 的模型组。'
            printf '%s\n' ''
            section '## Troubleshooting' '## Security notes'
          } | rewrite_assets > wiki/Troubleshooting.md

          {
            printf '%s\n' '# Architecture'
            printf '%s\n' ''
            printf '%s\n' '## `1+x`：结构化预识别 + 自由证据调用'
            printf '%s\n' ''
            printf '%s\n' '`vision_bootstrap` 的 pass 1 只建立 task-independent visual map：visual kind、regions、visible text、entities、relationships、uncertainties 和 recommended follow-ups。它不应该提前替用户完成任务。'
            printf '%s\n' ''
            printf '%s\n' 'Bootstrap 之后至少再做一次证据调用；具体是 describe、detect、ground、crop、OCR、pixel diff，还是连续多次调用，由 agent 根据任务决定。因此这是 **`1+x`**，而不是固定的两次识别。'
            printf '%s\n' ''
            printf '%s\n' '```text'
            printf '%s\n' 'image → structured bootstrap → x follow-up vision calls → DeepSeek reasoning'
            printf '%s\n' '```'
            printf '%s\n' ''
            section '## How it works' '## Provider fallback chain'
          } | rewrite_assets > wiki/Architecture.md

          {
            printf '%s\n' '### dsh-vision-router'
            printf '%s\n' ''
            printf '%s\n' '- **[Home](Home)**'
            printf '%s\n' '- **[Getting Started](Getting-Started)**'
            printf '%s\n' '- **[Settings Reference](Settings-Reference)**'
            printf '%s\n' '- **[Vision Providers](Vision-Providers)**'
            printf '%s\n' '- **[Troubleshooting](Troubleshooting)**'
            printf '%s\n' '- **[Architecture](Architecture)**'
            printf '%s\n' ''
            printf '%s\n' '---'
            printf '%s\n' ''
            printf '%s\n' '[Repository](https://github.com/ysr666/dsh-vision-router) · [Issues](https://github.com/ysr666/dsh-vision-router/issues) · [中文 README](https://github.com/ysr666/dsh-vision-router/blob/main/README.zh.md)'
          } > wiki/_Sidebar.md

      - name: Commit and push wiki
        shell: bash
        run: |
          set -euo pipefail
          cd wiki
          git add Home.md Getting-Started.md Settings-Reference.md Vision-Providers.md Troubleshooting.md Architecture.md _Sidebar.md
          if git diff --cached --quiet; then
            echo "Wiki already up to date"
            exit 0
          fi
          git commit -m "docs: build initial project wiki"
          git push origin HEAD
