# Getting Started

## 1. 安装

正常 npm / npx 安装只需要一条命令：

```sh
npx @deepseek-ai/dsh plugin --profile web add dsh-vision-router
```

如果你从 DeepSeek Harness 源码仓库运行：

```sh
cd deepseek-harness
pnpm dsh plugin --profile web add dsh-vision-router
```

如果插件刚安装进一个已经长期运行的 DSH Web 进程，让 Web 进程重新加载一次以发现插件 bundle。**插件加载完成后，模型目录和 wrapper scope 的变化可热更新，通常不需要再次重启。**

## 2. 选择正确的模型组

Vision Router 默认不会篡改原来的模型组，而是创建同名的视觉包装组，例如：

```text
opencode-go
opencode-go + Auto Vision
```

发送图片前，请在聊天输入框右下角选择带 **`+ Auto Vision`** 的组。

如果仍然使用原始纯文本模型组，DSH 可能会在 Vision Router 接管图片前就报：

```text
the current model does not support images
```

这通常不是视觉后端坏了，而是选错了聊天模型入口。

## 3. 发送图片

可以像普通聊天一样：

- 直接粘贴图片；
- 上传图片附件；
- 让 agent 在工作区内继续对图片做 crop / OCR / grounding / pixel diff 等多步分析。

默认免费视觉链已经存在，不需要先注册 API key。

## 4. Oh-DSH Desktop

Oh-DSH Desktop 使用自己的 DSH home 和 `desktop` profile，不读取普通 `~/.dsh` 的 Web profile。

macOS / Linux：

```sh
DSH_HOME=~/.ohdsh npx @deepseek-ai/dsh plugin --profile desktop add dsh-vision-router
```

Windows PowerShell：

```powershell
$env:DSH_HOME = "$env:USERPROFILE\.ohdsh"
npx @deepseek-ai/dsh plugin --profile desktop add dsh-vision-router
```

不要同时混用 Desktop marketplace 安装和上面的直接命令。

## 5. 升级

建议显式指定目标版本，尤其是刚发布不到 24 小时的新版本：

```sh
npx @deepseek-ai/dsh plugin --profile web add dsh-vision-router@<version>
```

如果出现新版本已经发布但 pnpm 显示 `downloaded 0` / `added 0`：

```sh
npx dsh-vision-router repair
```

## 6. 卸载

```sh
npx @deepseek-ai/dsh plugin --profile web remove dsh-vision-router
```

源码 checkout：

```sh
pnpm dsh plugin --profile web remove dsh-vision-router
```

如果你曾经为了 stealth mode 手动禁用了官方 DeepSeek row，卸载后记得重新启用它。

## 下一步

- 想换成本地 Ollama / LM Studio：看 **[Vision Providers](Vision-Providers)**
- 想弄懂设置页：看 **[Settings Reference](Settings-Reference)**
- 出现报错：看 **[Troubleshooting](Troubleshooting)**
