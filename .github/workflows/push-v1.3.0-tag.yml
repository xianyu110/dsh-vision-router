name: Push v1.3.0 tag

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/push-v1.3.0-tag.yml'

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Push release tag at the reviewed release commit
        run: |
          TARGET=1913a0b8a0a399ad62eaeda0f668330f7ae5ba5c
          test "$(git show "$TARGET:package.json" | node -e "let s='';process.stdin.on('data',d=>s+=d);process.stdin.on('end',()=>process.stdout.write(JSON.parse(s).version))")" = "1.3.0"
          if git ls-remote --exit-code --tags origin refs/tags/v1.3.0 >/dev/null 2>&1; then
            echo 'v1.3.0 already exists; leaving it untouched.'
          else
            git tag v1.3.0 "$TARGET"
            git push origin refs/tags/v1.3.0
          fi
