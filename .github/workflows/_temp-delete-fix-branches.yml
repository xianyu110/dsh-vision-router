name: Clean merged fix branches
"on":
  push:
    branches:
      - main
    paths:
      - .github/workflows/_temp-delete-fix-branches.yml
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Delete merged fix branches
        shell: bash
        run: |
          set -euo pipefail
          git push origin --delete fix/issue-153-attachment-materialize fix/issue-155-settings-mutate-loop
