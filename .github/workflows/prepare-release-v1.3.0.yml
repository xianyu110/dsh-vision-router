name: Prepare release v1.3.0

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/prepare-release-v1.3.0.yml'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Prepare release branch
        run: |
          git checkout -B release/v1.3.0
          python - <<'PY'
          import json
          from pathlib import Path

          p = Path('package.json')
          data = json.loads(p.read_text())
          data['version'] = '1.3.0'
          p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n')

          p = Path('README.md')
          s = p.read_text()
          s = s.replace('releases/tag/v1.2.1"><img src="https://img.shields.io/badge/release-v1.2.1-', 'releases/tag/v1.3.0"><img src="https://img.shields.io/badge/release-v1.3.0-')
          s = s.replace('alt="Release v1.2.1"', 'alt="Release v1.3.0"')
          old = '> 📌 **Announcement (v1.2.3)**\n>\n> v1.2.3 fixes'
          new = '> 📌 **Announcement (v1.3.0)**\n>\n> **v1.3.0** makes long sessions and mixed-plugin setups safer: the vision-tool schema is stable by default to protect prefix/KV caches, diagnostics can be persisted and opened from Settings, custom vision-model filtering explains missing image metadata and supports re-detection, host-provided DSH capability packages use the correct peer contract, and Vision Router tool cards can coexist with other vision plugins while keeping Vision Router rendering precedence.\n>\n> v1.2.3 fixes'
          assert old in s
          p.write_text(s.replace(old, new, 1))

          p = Path('README.zh.md')
          s = p.read_text()
          s = s.replace('releases/tag/v1.2.1"><img src="https://img.shields.io/badge/release-v1.2.1-', 'releases/tag/v1.3.0"><img src="https://img.shields.io/badge/release-v1.3.0-')
          s = s.replace('alt="Release v1.2.1"', 'alt="Release v1.3.0"')
          old = '> 📌 **公告（v1.2.3）**\n>\n> v1.2.3 现已支持：'
          new = '> 📌 **公告（v1.3.0）**\n>\n> **v1.3.0** 重点加固长会话稳定性与插件共存：视觉工具 schema 默认从会话开始保持稳定，减少 prefix/KV cache 失效；诊断日志可持久化并从设置页直接打开；自定义视觉模型缺失 image 元数据时会明确解释并支持重新检测；宿主提供的 DSH capability 包使用正确的 peer 依赖契约；与其他视觉插件共装时，同名工具卡不再导致启动失败，同时保留 Vision Router 自己的渲染优先级。\n>\n> v1.2.3 现已支持：'
          assert old in s
          p.write_text(s.replace(old, new, 1))

          p = Path('CHANGELOG.md')
          s = p.read_text()
          marker = '\n## v1.2.3\n'
          assert marker in s
          entry = '''\n## v1.3.0\n\n### 改进 / Changed\n\n- **长会话默认保持稳定工具 schema（#81 / #86）**：`progressiveTools` 改为显式 opt-in；默认从会话开始注册完整视觉工具集合，图片轮不再中途扩展 tools schema，减少 prefix/KV cache 失效与重复计费风险。\n- **Stable tool schema for long sessions by default (#81 / #86)**: `progressiveTools` is now explicit opt-in. The complete vision tool set is registered from session start so image turns no longer expand the request tool schema mid-session and invalidate prefix/KV caches.\n- **可持久化诊断日志（#88）**：现有诊断信息写入 `$DSH_HOME` 下的有界、脱敏日志，并可从设置页一键打开日志目录；包含轮转、同源保护与 macOS / Windows / Linux 兼容。\n- **Persistent diagnostics (#88)**: existing diagnostics can be written to a bounded, redacted log under `$DSH_HOME`, with a one-click Settings action to reveal the folder across macOS, Windows and Linux.\n- **视觉模型目录诊断更明确（#89）**：视觉后端按 model 粒度过滤，不会因为同一 provider 中某个模型缺少 image 能力就误伤整个 provider；无法验证 image 元数据时会列出被隐藏模型、给出修复提示，并支持重新检测。\n- **Clearer vision-model catalog diagnostics (#89)**: filtering is per model, so one text-only or unverifiable model cannot hide image-capable siblings from the same provider. Hidden models explain missing image metadata and support re-detection.\n\n### 修复 / Fixed\n\n- **宿主 DSH capability 包使用 peer 依赖（#87 / #90）**：`@deepseek-ai/dsh-llm-deepseek` 与 `@deepseek-ai/dsh-anonymous-user-id` 改为 `peerDependencies`，避免 profile 内重复宿主能力包；`@deepseek-ai/schemastery` 按官方 DSH package cookbook 继续作为 runtime `dependency`，并加入 manifest 回归测试。\n- **Host DSH capability packages use peers (#87 / #90)**: `@deepseek-ai/dsh-llm-deepseek` and `@deepseek-ai/dsh-anonymous-user-id` now use `peerDependencies`; `@deepseek-ai/schemastery` correctly remains a runtime dependency per the official DSH package cookbook.\n- **与其他视觉插件共装不再因 toolview key 冲突启动失败（#91 / #92）**：Vision Router 为自己的 keyed 工具卡使用独立的 `priority: -10`，允许默认 priority 的其他视觉插件共存，同时保留 Vision Router 自己的渲染优先级。工具执行与视觉路由逻辑不变。\n- **No startup failure from toolview-key collisions with other vision plugins (#91 / #92)**: Vision Router registers its keyed tool cards at `priority: -10`, allowing default-priority renderers from other plugins to coexist while keeping Vision Router rendering precedence. Tool execution and vision routing are unchanged.\n\n### 兼容性说明 / Compatibility note\n\n- 推荐安装方式仍是官方 DSH CLI：`npx @deepseek-ai/dsh plugin --profile web add dsh-vision-router`。第三方 `dsh-web-plugin-manager` / `dshpm` 当前仍可能误判 Schemastery；该上游兼容性问题继续跟踪于 #87，不影响推荐的 npx 安装链路。\n- The recommended install path remains the official DSH CLI: `npx @deepseek-ai/dsh plugin --profile web add dsh-vision-router`. The third-party `dsh-web-plugin-manager` / `dshpm` may still reject Schemastery due to its current quality-gate rule; that upstream compatibility issue remains tracked in #87 and does not affect the recommended npx path.\n'''
          p.write_text(s.replace(marker, entry + marker, 1))
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/prepare-release-v1.3.0.yml
          git add package.json README.md README.zh.md CHANGELOG.md
          git commit -m 'release: prepare v1.3.0'
          git push origin HEAD:release/v1.3.0 --force
