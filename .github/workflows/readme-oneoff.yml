name: One-off README cleanup

on:
  push:
    paths:
      - '.github/workflows/readme-oneoff.yml'

permissions:
  contents: write

jobs:
  update-readmes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Make install one-command and add compact TOCs
        shell: python
        run: |
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {count}")
              return text.replace(old, new, 1)

          # English README
          p = Path("README.md")
          s = p.read_text(encoding="utf-8")

          toc_marker = '''<p align="center">\n  <img src="assets/vision-demo.gif" width="640" alt="Demo: paste an image, the agent locates the send button with vision_ground / vision_crop / vision_pixel_diff and answers with coordinates" />\n</p>\n\n## Why this exists'''
          toc_replacement = '''<p align="center">\n  <img src="assets/vision-demo.gif" width="640" alt="Demo: paste an image, the agent locates the send button with vision_ground / vision_crop / vision_pixel_diff and answers with coordinates" />\n</p>\n\n## Contents\n\n- [Why this exists](#why-this-exists)\n- [How it compares](#how-it-compares)\n- [Quick start](#quick-start)\n- [Highlights](#highlights)\n- [How it works](#how-it-works)\n- [Tools](#tools)\n- [Configuration](#configuration)\n- [Install and lifecycle](#install-and-lifecycle)\n- [Troubleshooting](#troubleshooting)\n\n## Why this exists'''
          if "## Contents" not in s:
              s = replace_once(s, toc_marker, toc_replacement, "README.md TOC")

          old_quick = '''### 1. Install and load the plugin\n\nRecommended for normal npm/npx installs (the same launch style used by the DSH README):\n\n```sh\nnpx @deepseek-ai/dsh plugin --profile web add dsh-vision-router\nnpx @deepseek-ai/dsh web\n```\n\nIf you run DeepSeek Harness from a source checkout with pnpm, use the workspace script instead — `dsh` is not necessarily on your shell `PATH`:\n\n```sh\ncd deepseek-harness\npnpm dsh plugin --profile web add dsh-vision-router\npnpm dsh web\n```\n\nIf you already installed the DSH CLI globally and `dsh` is on `PATH`, the shorter `dsh ...` form works too.\n'''
          new_quick = '''### 1. Install the plugin\n\nFor normal npm/npx installs, installation is a single command:\n\n```sh\nnpx @deepseek-ai/dsh plugin --profile web add dsh-vision-router\n```\n\nIf you run DeepSeek Harness from a source checkout with pnpm, use the workspace script instead — `dsh` is not necessarily on your shell `PATH`:\n\n```sh\ncd deepseek-harness\npnpm dsh plugin --profile web add dsh-vision-router\n```\n\nIf you already installed the DSH CLI globally and `dsh` is on `PATH`, the shorter `dsh ...` form works too. After installation, start or reload DSH Web as you normally do.\n'''
          s = replace_once(s, old_quick, new_quick, "README.md quick start")

          old_install = '''Normal npm/npx install:\n\n```sh\nnpx @deepseek-ai/dsh plugin --profile web add dsh-vision-router\nnpx @deepseek-ai/dsh --profile web --dump-config | grep vision-router\n```\n\nFrom a DeepSeek Harness source checkout:\n\n```sh\npnpm dsh plugin --profile web add dsh-vision-router\npnpm dsh --profile web --dump-config | grep vision-router\n```\n'''
          new_install = '''Normal npm/npx install — one command:\n\n```sh\nnpx @deepseek-ai/dsh plugin --profile web add dsh-vision-router\n```\n\nFrom a DeepSeek Harness source checkout:\n\n```sh\npnpm dsh plugin --profile web add dsh-vision-router\n```\n\nOptional verification:\n\n```sh\nnpx @deepseek-ai/dsh --profile web --dump-config | grep vision-router\n# source checkout: pnpm dsh --profile web --dump-config | grep vision-router\n```\n'''
          s = replace_once(s, old_install, new_install, "README.md lifecycle install")
          p.write_text(s, encoding="utf-8")

          # Chinese README
          p = Path("README.zh.md")
          s = p.read_text(encoding="utf-8")

          toc_marker = '''<p align="center">\n  <img src="assets/vision-demo.gif" width="640" alt="演示：粘贴图片，Agent 用 vision_ground / vision_crop / vision_pixel_diff 定位发送按钮并给出坐标" />\n</p>\n\n## 为什么做这个'''
          toc_replacement = '''<p align="center">\n  <img src="assets/vision-demo.gif" width="640" alt="演示：粘贴图片，Agent 用 vision_ground / vision_crop / vision_pixel_diff 定位发送按钮并给出坐标" />\n</p>\n\n## 目录\n\n- [为什么做这个](#为什么做这个)\n- [对比同类插件](#对比同类插件)\n- [快速开始](#快速开始)\n- [亮点](#亮点)\n- [工作原理](#工作原理)\n- [工具](#工具)\n- [配置项](#配置项)\n- [安装与生命周期](#安装与生命周期)\n- [故障排查](#故障排查)\n\n## 为什么做这个'''
          if "## 目录" not in s:
              s = replace_once(s, toc_marker, toc_replacement, "README.zh.md TOC")

          old_quick = '''### 1. 安装并让插件加载\n\n普通 npm / npx 安装方式推荐这样用（与 DSH 官方 README 的启动方式一致）：\n\n```sh\nnpx @deepseek-ai/dsh plugin --profile web add dsh-vision-router\nnpx @deepseek-ai/dsh web\n```\n\n如果你是从 DeepSeek Harness 源码仓库通过 pnpm 运行，`dsh` 不一定在系统 `PATH` 里，请改用工作区脚本：\n\n```sh\ncd deepseek-harness\npnpm dsh plugin --profile web add dsh-vision-router\npnpm dsh web\n```\n\n如果你已经全局安装 DSH CLI，并且终端里能直接执行 `dsh`，也可以继续使用较短的 `dsh ...` 写法。\n'''
          new_quick = '''### 1. 安装插件\n\n普通 npm / npx 安装只需要一条命令：\n\n```sh\nnpx @deepseek-ai/dsh plugin --profile web add dsh-vision-router\n```\n\n如果你是从 DeepSeek Harness 源码仓库通过 pnpm 运行，`dsh` 不一定在系统 `PATH` 里，请改用工作区脚本：\n\n```sh\ncd deepseek-harness\npnpm dsh plugin --profile web add dsh-vision-router\n```\n\n如果你已经全局安装 DSH CLI，并且终端里能直接执行 `dsh`，也可以继续使用较短的 `dsh ...` 写法。安装完成后，按你平时的方式启动或重新加载 DSH Web 即可。\n'''
          s = replace_once(s, old_quick, new_quick, "README.zh.md quick start")

          old_install = '''普通 npm / npx 安装：\n\n```sh\nnpx @deepseek-ai/dsh plugin --profile web add dsh-vision-router\nnpx @deepseek-ai/dsh --profile web --dump-config | grep vision-router\n```\n\n从 DeepSeek Harness 源码仓库运行：\n\n```sh\npnpm dsh plugin --profile web add dsh-vision-router\npnpm dsh --profile web --dump-config | grep vision-router\n```\n'''
          new_install = '''普通 npm / npx 安装——一条命令：\n\n```sh\nnpx @deepseek-ai/dsh plugin --profile web add dsh-vision-router\n```\n\n从 DeepSeek Harness 源码仓库运行：\n\n```sh\npnpm dsh plugin --profile web add dsh-vision-router\n```\n\n可选验证：\n\n```sh\nnpx @deepseek-ai/dsh --profile web --dump-config | grep vision-router\n# 源码仓库：pnpm dsh --profile web --dump-config | grep vision-router\n```\n'''
          s = replace_once(s, old_install, new_install, "README.zh.md lifecycle install")
          p.write_text(s, encoding="utf-8")

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md README.zh.md
          if git diff --cached --quiet; then
            echo "No README changes needed."
          else
            git commit -m "docs: make install one-command and add TOC"
            git push origin HEAD:main
          fi
