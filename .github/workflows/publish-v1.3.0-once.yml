name: Publish v1.3.0 once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v1.3.0-once.yml'

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: v1.3.0
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org/'
          cache: pnpm
      - name: Verify release snapshot
        run: |
          test "$(node -p "require('./package.json').version")" = '1.3.0'
          grep -q 'v1.3.0' README.md
          grep -q 'v1.3.0' README.zh.md
          grep -q '^## v1.3.0$' CHANGELOG.md
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - name: Publish npm package if needed
        run: |
          if npm view dsh-vision-router@1.3.0 version >/dev/null 2>&1; then
            echo 'dsh-vision-router@1.3.0 already exists — skipping publish.'
          else
            npm publish --provenance --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Compose bilingual release notes
        run: |
          {
            echo '# v1.3.0'
            echo
          } > release-notes.md
          awk -v v='v1.3.0' '$0 == "## " v { flag=1; next } /^## / && flag { exit } flag' CHANGELOG.md >> release-notes.md
          {
            echo
            echo '## Commits'
            echo
          } >> release-notes.md
          PREV_TAG=$(git describe --tags --abbrev=0 v1.3.0^ 2>/dev/null || true)
          if [ -n "$PREV_TAG" ]; then
            git log --pretty=format:'- %s' "$PREV_TAG..v1.3.0" >> release-notes.md
          else
            git log --pretty=format:'- %s' v1.3.0 >> release-notes.md
          fi
      - name: Create GitHub Release if needed
        run: |
          if gh release view v1.3.0 >/dev/null 2>&1; then
            echo 'GitHub Release v1.3.0 already exists — leaving it untouched.'
          else
            gh release create v1.3.0 --title v1.3.0 --notes-file release-notes.md --verify-tag
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
