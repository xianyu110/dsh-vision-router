name: Fix toolview slot priority

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-toolview-slot-priority.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Patch keyed toolview priorities and regression test
        run: |
          python - <<'PY'
          from pathlib import Path

          client = Path('lib/client.js')
          s = client.read_text()
          old_present = "{ name: 'tool.call.toolview', key: 'vision_present', inject: () => ({}) }"
          new_present = "{ name: 'tool.call.toolview', key: 'vision_present', priority: 100, inject: () => ({}) }"
          old_artifact = "{ name: 'tool.call.toolview', key, inject: () => ({}) }"
          new_artifact = "{ name: 'tool.call.toolview', key, priority: 100, inject: () => ({}) }"
          assert s.count(old_present) == 1, s.count(old_present)
          assert s.count(old_artifact) == 1, s.count(old_artifact)
          s = s.replace(old_present, new_present).replace(old_artifact, new_artifact)
          client.write_text(s)

          test = Path('tests/client.test.js')
          t = test.read_text()
          marker = "toolview cards use a non-default priority so other vision plugins can coexist (#91)"
          if marker not in t:
              block = "\n\ntest('toolview cards use a non-default priority so other vision plugins can coexist (#91)', () => {\n  const source = readFileSync(new URL('../lib/client.js', import.meta.url), 'utf8')\n  // DSH keyed slots allow the same key at different priorities. Keep our\n  // presentation cards away from the default priority 0 used by other vision\n  // plugins (notably @anionex/dsh-vision-toolkit), so both plugins can load.\n  assert.equal(source.includes(\"key: 'vision_present', priority: 100\"), true)\n  assert.equal(source.includes(\"key, priority: 100, inject\"), true)\n})\n"
              test.write_text(t + block)
          PY
      - name: Run focused client tests
        run: node --test tests/client.test.js
      - name: Commit fix on a review branch and remove one-shot workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/fix-toolview-slot-priority.yml
          git add lib/client.js tests/client.test.js
          git commit -m "fix: avoid toolview slot collisions with other vision plugins (#91)"
          git push origin HEAD:fix/issue-91-toolview-priority --force
