name: Apply rc7 conformance patch

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'agent/rc7-conformance'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/rc7-conformance
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
      - run: corepack enable
      - name: Apply compatibility patch
        run: python scripts/_rc7_patch.py
      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false
      - name: Run full test suite
        run: pnpm test
      - name: Commit validated patch to PR branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: align with dsh rc7 contracts"
          git push origin HEAD:agent/rc7-conformance
