# second push intentionally triggers the one-shot workflow now that it exists on main
name: Temporary rc7 branch sync

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  sync:
    if: github.event.head_commit.message == 'chore: add temporary rc7 sync workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/rc7-conformance
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 11.20.0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
      - name: Merge latest main and resolve known rc7 overlaps
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git merge origin/main --no-commit --no-ff || true

          for path in index.js lib/client.js package.json; do
            if git diff --name-only --diff-filter=U | grep -Fxq "$path"; then
              git checkout --ours -- "$path"
              git add "$path"
            fi
          done

          remaining="$(git diff --name-only --diff-filter=U)"
          if [ -n "$remaining" ]; then
            echo 'Unexpected merge conflicts remain:'
            echo "$remaining"
            exit 1
          fi

          git diff 191db28ac842b93fd335343497b74b504d2854dc 382cdff81325633008984e06dc2aa0e229526ab5 -- index.js lib/client.js | git apply --3way
          git add index.js lib/client.js package.json

          python - <<'PY'
          from pathlib import Path

          client = Path('lib/client.js')
          text = client.read_text()
          old = "const DEVELOPER_TOGGLE_KEYS = ['stealth']"
          if old not in text:
              raise SystemExit('expected stealth developer toggle declaration not found')
          text = text.replace(old, 'const DEVELOPER_TOGGLE_KEYS = []', 1)
          client.write_text(text)

          index = Path('index.js')
          text = index.read_text()
          old = "  // 默认关闭（issue #34 明确 opt-in）：关闭时官方 deepseek-official 路由\n  // 原样保留；唯一例外见 apply 里的 keep-alive 兜底（官方行被禁用时）。\n  stealth: z.boolean().default(false),"
          new = "  // Deprecated compatibility key: retained so existing settings documents still parse.\n  // rc.7+ provider ownership is host-authoritative; Vision Router no longer takes over\n  // or synthesizes the official deepseek-official adapter. The client no longer exposes this toggle.\n  stealth: z.boolean().default(false),"
          if old not in text:
              raise SystemExit('expected stealth config comment not found')
          text = text.replace(old, new, 1)
          index.write_text(text)

          test = Path('tests/rc7-conformance.test.js')
          text = test.read_text()
          marker = "test('attachment contract stays store-owned and bundle does not widen host limits', async () => {"
          if marker not in text:
              raise SystemExit('rc7 conformance test marker not found')
          extra = """test('deprecated stealth takeover is not exposed in Settings', async () => {\n  const client = await read('../lib/client.js')\n  const source = await read('../index.js')\n  assert.match(client, /const DEVELOPER_TOGGLE_KEYS = \[\]/)\n  assert.doesNotMatch(client, /const DEVELOPER_TOGGLE_KEYS = \['stealth'\]/)\n  assert.match(source, /stealth takeover is deprecated/)\n})\n\n"""
          if "deprecated stealth takeover is not exposed in Settings" not in text:
              text = text.replace(marker, extra + marker, 1)
          test.write_text(text)
          PY
          git add index.js lib/client.js tests/rc7-conformance.test.js

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false
      - name: Run full test suite
        run: pnpm test
      - name: Commit reconciled branch
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          if git diff --cached --quiet; then
            echo 'No branch changes to commit.'
            exit 0
          fi
          git commit -m 'chore: sync rc7 conformance with main'
          git push origin HEAD:agent/rc7-conformance
