name: temp-tag-v1.4.3

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  tag:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tag exact release commit
        shell: bash
        run: |
          git fetch --tags --force
          if git rev-parse -q --verify refs/tags/v1.4.3 >/dev/null; then
            echo "v1.4.3 already exists"
            exit 0
          fi
          git tag v1.4.3 298acd53a89eb8cc709274975d0afe5718fbd86a
          git push origin refs/tags/v1.4.3
