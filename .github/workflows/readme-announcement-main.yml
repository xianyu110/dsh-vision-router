name: One-off announcement cleanup

on:
  push:
    paths:
      - '.github/workflows/readme-announcement-main.yml'

permissions:
  contents: write

jobs:
  update-readmes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Shorten v1.3.0 announcements
        shell: python
        run: |
          from pathlib import Path

          def replace_block(path, start_marker, replacement):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              start = text.index(start_marker)
              end = text.index('<p align="center">', start)
              p.write_text(text[:start] + replacement + '\n\n' + text[end:], encoding='utf-8')

          replace_block(
              'README.md',
              '> [!WARNING]\n> 📌 **Announcement (v1.3.0)**',
              '> [!WARNING]\n> 📌 **Announcement (v1.3.0)**\n>\n> **v1.3.0** improves long-session stability, diagnostics, vision-model detection, and coexistence with other vision plugins.'
          )
          replace_block(
              'README.zh.md',
              '> [!WARNING]\n> 📌 **公告（v1.3.0）**',
              '> [!WARNING]\n> 📌 **公告（v1.3.0）**\n>\n> **v1.3.0**：增强长会话稳定性、诊断日志、视觉模型检测与多视觉插件共存。'
          )

      - name: Commit to docs branch
        shell: bash
        run: |
          rm .github/workflows/readme-announcement-main.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b docs/short-v130-announcement-final
          git add README.md README.zh.md .github/workflows/readme-announcement-main.yml
          git commit -m "docs: shorten v1.3.0 announcement"
          git push origin HEAD:docs/short-v130-announcement-final
